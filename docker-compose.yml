name: mushrooms-predictions

services:
  postgres:
    # Build multi-arch (amd64 + arm64): postgis/postgis pubblica solo amd64 e su
    # Apple Silicon girerebbe emulato. Stesso contenuto, variante indicata dal
    # README ufficiale di postgis/postgis.
    image: imresamu/postgis:17-3.5-alpine
    container_name: mushrooms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushrooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mushrooms}
      POSTGRES_DB: ${POSTGRES_DB:-mushrooms}
      # Le serie meteo si ordinano/aggregano meglio con una collation stabile.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mushrooms} -d ${POSTGRES_DB:-mushrooms}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mushrooms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mushrooms}:${POSTGRES_PASSWORD:-mushrooms}@postgres:5432/${POSTGRES_DB:-mushrooms}?schema=public
    ports:
      - '${API_PORT:-4000}:4000'
    profiles: ['full']

  # L'ingestione giornaliera vive qui e non dentro l'API.
  #
  # Il motivo e' che i due processi hanno modi diversi di rompersi: se l'API
  # cade, un job che vivesse dentro di lei semplicemente non partirebbe, e non
  # ci sarebbe niente a dirlo - la mappa resterebbe a ieri senza un errore.
  # Separandoli, un'API giu' non ferma l'ingestione e uno scheduler giu' si
  # vede in `docker ps`.
  #
  # Stessa immagine dell'API, comando diverso: nessuna seconda build, e il
  # cron esegue esattamente il codice che gira in produzione.
  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mushrooms-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mushrooms}:${POSTGRES_PASSWORD:-mushrooms}@postgres:5432/${POSTGRES_DB:-mushrooms}?schema=public
      # Il fuso non e' un dettaglio: tutto il sistema ragiona per giorni locali
      # italiani, e uno scheduler in UTC lancerebbe l'ingestione alle 7:30 di
      # mattina d'estate, con l'ultimo giorno completo ancora incerto.
      TZ: ${TZ:-Europe/Rome}
      INGESTION_AT: ${INGESTION_AT:-05:30}
      INGESTION_RUN_ON_START: ${INGESTION_RUN_ON_START:-true}
      # Le specie da calcolare ogni giorno, separate da spazio. Aggiungere un
      # profilo vuol dire aggiungere una parola qui.
      INGESTION_SPECIES: ${INGESTION_SPECIES:-boletus-edulis boletus-aereus}
    entrypoint: ['/app/docker/scheduler/entrypoint.sh']
    # Non il ping HTTP che l'immagine dell'API porta con se': qui non c'e'
    # nessun server ad ascoltare sulla 4000, e il container risulterebbe
    # unhealthy per sempre. La domanda giusta per uno scheduler e' un'altra -
    # **ha prodotto un'ingestione di recente?** - e si risponde guardando
    # `ingestion_run`. Cosi' "unhealthy" significa "ha smesso di girare", che
    # e' il guasto vero e l'unico che valga la pena vedere in `docker ps`.
    #
    # Ogni mezz'ora e non ogni trenta secondi: la risposta cambia una volta al
    # giorno, interrogarla piu' spesso apre una connessione al database per
    # nulla.
    healthcheck:
      test: ['CMD', 'node', 'dist/src/cli/main.cli.js', 'health:ingestion']
      interval: 30m
      timeout: 30s
      start_period: 2m
      retries: 2
    profiles: ['full', 'scheduler']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mushrooms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: http://api:4000/graphql
    ports:
      - '${WEB_PORT:-3000}:3000'
    profiles: ['full']

volumes:
  postgres-data:
