name: mushrooms-predictions

services:
  postgres:
    # Build multi-arch (amd64 + arm64): postgis/postgis pubblica solo amd64 e su
    # Apple Silicon girerebbe emulato. Stesso contenuto, variante indicata dal
    # README ufficiale di postgis/postgis.
    image: imresamu/postgis:17-3.5-alpine
    container_name: mushrooms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushrooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mushrooms}
      POSTGRES_DB: ${POSTGRES_DB:-mushrooms}
      # Le serie meteo si ordinano/aggregano meglio con una collation stabile.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mushrooms} -d ${POSTGRES_DB:-mushrooms}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mushrooms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mushrooms}:${POSTGRES_PASSWORD:-mushrooms}@postgres:5432/${POSTGRES_DB:-mushrooms}?schema=public
    ports:
      - '${API_PORT:-4000}:4000'
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mushrooms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: http://api:4000/graphql
    ports:
      - '${WEB_PORT:-3000}:3000'
    profiles: ['full']

volumes:
  postgres-data:
